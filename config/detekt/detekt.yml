# detekt 규칙 설정
# detekt 기본 규칙(--build-upon-default-config) 위에 이 프로젝트에서 바꾸는 것만 적습니다.
# 전체 규칙 목록: https://detekt.dev/docs/rules/complexity

config:
  validation: true # 오타 난 규칙 이름이 있으면 실행 실패

style:
  MaxLineLength:
    maxLineLength: 120 # .editorconfig(ktlint)와 같은 기준

complexity:
  TooManyFunctions:
    # ViewModel은 화면 이벤트마다 짧은 함수가 하나씩 있는 구조라 기본값(11)보다 여유 있게
    thresholdInClasses: 15
